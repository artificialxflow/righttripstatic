<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>گردشگری ورزشی | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6">
    <h1 class="section-title reveal">مرکز حقوق گردشگری ورزشی 🏃‍♂️⚖️</h1>
    <p class="section-sub reveal">قرارداد، بیمه، حوادث و رویدادهای ورزشی — تخصص مجری طرح</p>
    <div class="mt-8 grid gap-4 sm:grid-cols-2 reveal">
      <article class="card-bordered border-amber-400 bg-amber-50/40 p-5 card-hover"><h2 class="font-bold text-amber-950">قرارداد مربی و باشگاه</h2><p class="mt-2 text-sm">الگوها و مسئولیت‌ها</p></article>
      <article class="card-bordered p-5 card-hover"><h2 class="font-bold">بیمه ورزشی مسافرتی</h2><p class="mt-2 text-sm">پوشش حوادث در تورهای ورزشی</p></article>
      <article class="card-bordered p-5 card-hover"><h2 class="font-bold">رویداد و مسابقات</h2><p class="mt-2 text-sm">مجوزها و liabilities</p></article>
      <article class="card-bordered p-5 card-hover"><h2 class="font-bold">فعالیت ماجراجویانه</h2><p class="mt-2 text-sm">راهنما، تجهیزات، رضایت آگاهانه</p></article>
    </div>
  </main>
  <div id="site-footer-mount"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
</body>
</html>
