<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حقوق فعالان | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6">
    <h1 class="section-title reveal">سامانه حقوق فعالان گردشگری 🏨</h1>

      <div class="card-bordered p-5 text-center card-hover"><span class="text-3xl">✈️</span><h2 class="mt-2 font-bold">آژانس</h2></div>

    </div>
    <div class="mt-8 card-bordered p-6 reveal">
      <h2 class="font-bold">چک‌لیست انطباق حقوقی (نمایشی)</h2>
      <ul class="mt-4 space-y-2 text-sm">
        <li>☐ قرارداد استاندارد با مسافر</li>
        <li>☐ بیمه مسئولیت</li>
        <li>☐ آموزش پرسنل</li>
        <li>☐ سیاست حریم خصوصی</li>
      </ul>
    </div>

  <div id="site-footer-mount"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
</body>
</html>
