<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مطالعات و آراء | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6">
    <h1 class="section-title reveal">بانک مطالعات و آرای مرتبط 📰</h1>
    <p class="section-sub reveal">با رعایت حریم خصوصی و مالکیت فکری</p>
    <ul class="mt-8 space-y-3 reveal">
      <li class="card-bordered card-hover p-4"><button type="button" data-modal-open="case-modal" class="text-right w-full font-bold text-teal-900">مطالعه: مسئولیت آژانس در لغو تور</button></li>
      <li class="card-bordered card-hover p-4"><button type="button" data-modal-open="case-modal" class="text-right w-full font-bold">تحلیل: خسارت تأخیر پرواز</button></li>
    </ul>
  </main>
  <div id="case-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 p-4">
    <div class="card-bordered max-w-lg p-6"><h2 class="font-bold">خلاصه مطالعه (نمایشی)</h2><p class="mt-3 text-sm text-slate-600">متن anonymized برای آموزش کاربران...</p><button data-modal-close="case-modal" class="btn-primary mt-4">بستن</button></div>
  </div>
  <div id="site-footer-mount"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
