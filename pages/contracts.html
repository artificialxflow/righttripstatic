<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قراردادساز | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>
  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-10 sm:px-6">
    <h1 class="section-title reveal">قراردادساز گردشگری 📋</h1>
    <div class="mt-8 flex gap-2 text-sm reveal">
      <span class="rounded-lg border-2 border-orange-500 bg-orange-50 px-3 py-1 font-bold">۱ نوع</span>
      <span class="rounded-lg border border-slate-200 px-3 py-1">۲ اطلاعات</span>
      <span class="rounded-lg border border-slate-200 px-3 py-1">۳ پیش‌نمایش</span>
    </div>
    <div class="mt-6 card-bordered p-6 space-y-4 reveal">
      <label class="block text-sm font-medium">نوع قرارداد</label>
      <select class="w-full rounded-lg border-2 border-slate-200 px-4 py-2 text-sm">
        <option>رزرو تور</option>
        <option>هتل</option>
        <option>راهنمای گردشگری</option>
      </select>
      <button type="button" class="btn-primary w-full">مرحله بعد</button>
    </div>
  </main>
  <div id="site-footer-mount"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>
</body>
</html>
