<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>

  <title>متخصصان | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>

      <article class="card-bordered card-hover p-5 flex gap-4">

      </article>
      <article class="card-bordered card-hover p-5 flex gap-4">
        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=80&h=80&fit=crop" alt="تصویر مشاور" class="h-16 w-16 rounded-full border-2 border-violet-500 object-cover" loading="lazy" />
        <div><h2 class="font-bold">دکتر فاطمه موسوی</h2><p class="text-sm text-slate-600">مسئولیت مدنی · ۴.۶⭐</p></div>

  <div id="site-footer-mount"></div>
  <script src="../assets/js/common.js"></script>
  <script src="../assets/js/layout.js"></script>

</html>
