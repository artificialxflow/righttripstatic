<!DOCTYPE html>
<html lang="fa" dir="rtl" data-base="../">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حقوق گردشگر | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/custom.css" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 antialiased">
  <div id="site-header-mount"></div>
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6">
    <h1 class="section-title reveal">سامانه حقوق گردشگر 🧳</h1>
    <p class="section-sub reveal">آموزش حقوق تور، اقامت، خسارت، بیمه و حوادث</p>

      <article class="card-bordered card-hover p-5"><h2 class="font-bold">زیارت و سفر</h2><p class="mt-2 text-sm text-slate-600">نکات ویژه خراسان رضوی.</p></article>
