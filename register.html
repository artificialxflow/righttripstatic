<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ثبت‌نام | حقوق گردشگری</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/custom.css" />
</head>
<body class="min-h-screen bg-gradient-to-b from-teal-50 to-slate-100 antialiased">
  <div class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-12">
    <a href="index.html" class="mb-8 text-center text-sm font-medium text-teal-700 hover:underline">← بازگشت</a>
    <div class="card-bordered p-8">
      <h1 class="text-xl font-bold text-teal-900">ثبت‌نام در حقوق گردشگری</h1>
      <p class="mt-1 text-sm text-slate-600">حق‌گرد · نسخه نمایشی</p>
      <form class="mt-6 space-y-4" action="login.html" method="get">
        <input type="text" placeholder="نام و نام خانوادگی" class="w-full rounded-lg border-2 border-slate-200 px-4 py-2.5 text-sm" />
        <input type="email" placeholder="ایمیل" class="w-full rounded-lg border-2 border-slate-200 px-4 py-2.5 text-sm" />
        <button type="submit" class="btn-primary w-full">ادامه</button>
      </form>
    </div>
  </div>
</body>
</html>
